name: EARL
version: 1.0.0
formats: [CLAP, VST3, LV2, Standalone]
platforms: [Linux]
order: 1
# Its planet on the synths' page: its own (src/space.ts), made of chunks of its window in SW Light, ringed with its velvet noise
planet: earl
# The systems the framework builds for; none has a file yet
downloads:
  - { os: windows, arch: x64 }
  - { os: macos, arch: universal }
  - { os: linux, arch: x64 }
  - { os: linux, arch: arm64 }
audio: []
videos: []
# Its header: the framework's EarlLogo, the sun and the name standing on the horizon the page draws
logo: ./logo.png
# Taken from the framework by `npm run screenshots` (scripts/screenshots.mjs, which says how each one is taken).
# en.md and es.md place each screenshot with <!-- screenshot: <id> -->.
cover:
  image: ./screenshots/synth.png
  alt:
    en: "EARL's window on its Synth page: three oscillators, the noise and the sub-oscillator at the top, the filters and the voice's distortions under them, the envelopes and LFOs at the bottom"
    es: "La ventana de EARL en su página Synth: tres osciladores, el ruido y el suboscilador arriba, los filtros y las distorsiones de la voz debajo, y las envolventes y los LFO abajo"
screenshots:
  - id: velvet-noise
    image: ./screenshots/velvet-noise.png
    alt:
      en: "The velvet noise's panel: its pulses drawn as dots over its DENSITY, JITTER, PW, PAN and GAIN knobs and its LEVEL and MONO switches"
      es: "El panel del ruido velvet: sus pulsos dibujados como puntos sobre sus perillas DENSITY, JITTER, PW, PAN y GAIN y sus interruptores LEVEL y MONO"
    caption:
      en: "Its display draws the pulses as the noise plays them."
      es: "Su pantalla dibuja los pulsos tal como el ruido los toca."
  - id: graph
    image: ./screenshots/graph.png
    alt:
      en: "EARL's Graph page: the patch's processors as nodes joined by cables, the voice's on the left and the global effects on the right"
      es: "La página Graph de EARL: los procesadores del patch como nodos unidos por cables, los de la voz a la izquierda y los efectos globales a la derecha"
    caption:
      en: "The Graph page: each voice on the left, the effects on the right."
      es: "La página Graph: cada voz a la izquierda, los efectos a la derecha."
  - id: mod-matrix
    image: ./screenshots/mod-matrix.png
    alt:
      en: "EARL's Mod Matrix page: a row for each modulation, with its source, its target, its amount and its curve"
      es: "La página Mod Matrix de EARL: una fila por modulación, con su fuente, su destino, su cantidad y su curva"
    caption:
      en: "The Mod Matrix page: each modulation with its amount and its curve."
      es: "La página Mod Matrix: cada modulación con su cantidad y su curva."
  - id: global
    image: ./screenshots/global.png
    alt:
      en: "EARL's Global page: eight effect slots in two columns, and the global envelopes, LFOs and audio input under them"
      es: "La página Global de EARL: ocho ranuras de efectos en dos columnas, y debajo las envolventes, los LFO y la entrada de audio globales"
    caption:
      en: "The Global page: the eight effect slots, and the effects' own modulators."
      es: "La página Global: las ocho ranuras de efectos y los moduladores propios de los efectos."
  - id: randomiser
    image: ./screenshots/randomiser.png
    alt:
      en: "The randomiser's panel: a DEVIATION slider, switches for values, choices, mod amounts, processors, connections and new modulations, and the RESET and RANDOMISE buttons"
      es: "El panel del aleatorizador: un deslizador DEVIATION, interruptores para valores, opciones, cantidades de modulación, procesadores, conexiones y modulaciones nuevas, y los botones RESET y RANDOMISE"
    caption:
      en: "The randomiser, opened from the die in the header."
      es: "El aleatorizador, que se abre desde el dado de la cabecera."
  - id: notes
    image: ./screenshots/notes.png
    alt:
      en: "EARL's Notes page: the transposition, the chord maker and the arpeggiator at the top, the voices' and the unison's settings under them"
      es: "La página Notes de EARL: la transposición, el generador de acordes y el arpegiador arriba, y debajo los ajustes de las voces y del unísono"
    caption:
      en: "The Notes page: what changes the notes, and the voices, glide and unison."
      es: "La página Notes: lo que cambia las notas, y las voces, el glide y el unísono."
  - id: oscillator-unison
    image: ./screenshots/oscillator-unison.png
    alt:
      en: "A wavetable oscillator showing its unison: its voices drawn as lines between left and right, over its VOICES, DETUNE, WIDTH, BLEND, WT SPREAD and BIAS knobs"
      es: "Un oscilador de tablas de ondas mostrando su unísono: sus voces dibujadas como líneas entre izquierda y derecha, sobre sus perillas VOICES, DETUNE, WIDTH, BLEND, WT SPREAD y BIAS"
    caption:
      en: "An oscillator's unison."
      es: "El unísono de un oscilador."
  - id: voice-unison
    image: ./screenshots/voice-unison.png
    alt:
      en: "The voice's unison on the Notes page: its voices drawn as lines between left and right, over the UNISON menu and its DETUNE, WIDTH, BLEND and BIAS sliders"
      es: "El unísono de la voz en la página Notes: sus voces dibujadas como líneas entre izquierda y derecha, sobre el menú UNISON y sus deslizadores DETUNE, WIDTH, BLEND y BIAS"
    caption:
      en: "The voice's unison, on the Notes page."
      es: "El unísono de la voz, en la página Notes."
  - id: tuning
    image: ./screenshots/tuning.png
    alt:
      en: "EARL's Tuning page"
      es: "La página Tuning de EARL"
    caption:
      en: "The Tuning page."
      es: "La página Tuning."
# The slideshow of its skins, in the order it offers them (Tux is only on Linux): the Synth page in each, taken the same way
skins:
  - name: SW Default
    image: ./skins/sw-default.png
    alt:
      en: "EARL's Synth page in the SW Default skin: dark grey panels, its waves, envelopes and switches in violet, their points in yellow"
      es: "La página Synth de EARL con la skin SW Default: paneles gris oscuro, sus ondas, envolventes e interruptores en violeta y sus puntos en amarillo"
    caption:
      en: "SynthWorld's own: dark, in violet and yellow."
      es: "La de SynthWorld: oscura, en violeta y amarillo."
  - name: SW Light
    image: ./skins/sw-light.png
    alt:
      en: "EARL's Synth page in the SW Light skin: pale grey panels, dark text and knobs, its waves and switches in violet, their points in orange"
      es: "La página Synth de EARL con la skin SW Light: paneles gris claro, textos y perillas oscuros, sus ondas e interruptores en violeta y sus puntos en naranja"
    caption:
      en: "SynthWorld's own, light: pale panels and dark text."
      es: "La de SynthWorld, clara: paneles pálidos y texto oscuro."
  - name: Deep Sea
    image: ./skins/deep-sea.png
    alt:
      en: "EARL's Synth page in the Deep Sea skin: navy blue panels, its waves, envelopes and switches in bright blue, their points in amber"
      es: "La página Synth de EARL con la skin Deep Sea: paneles azul marino, sus ondas, envolventes e interruptores en azul vivo y sus puntos en ámbar"
    caption:
      en: "EARL's own: navy blues, a bright blue and amber."
      es: "La de EARL: azules marinos, un azul vivo y ámbar."
  - name: Riso
    image: ./skins/riso.png
    alt:
      en: "EARL's Synth page in the Riso skin: cards of speckled cream paper outlined in black ink, mustard knobs ringed with inked rays, displays of straw paper with their waves shaded in vermilion, and the panel that's off hatched over"
      es: "La página Synth de EARL con la skin Riso: tarjetas de papel crema moteado perfiladas en tinta negra, perillas mostaza rodeadas de rayos entintados, pantallas de papel de paja con sus ondas sombreadas en bermellón, y el panel apagado tachado con un rayado"
    caption:
      en: "EARL's own, a riso poster: paper, inks and shapes of its own."
      es: "La de EARL, un póster de risografía: papel, tintas y formas propias."
  - name: Starship
    image: ./skins/starship.png
    alt:
      en: "EARL's Synth page in the Starship skin: screens of dark glass with cut corners outlined in cyan light, dials lit up to their values, its waves and switches in cyan, their points in amber"
      es: "La página Synth de EARL con la skin Starship: pantallas de cristal oscuro con las esquinas cortadas y perfiladas en luz cian, diales iluminados hasta su valor, sus ondas e interruptores en cian y sus puntos en ámbar"
    caption:
      en: "EARL's own, a starship's cockpit: screens of glass lit in cyan."
      es: "La de EARL, la cabina de una nave: pantallas de cristal iluminadas en cian."
  - name: Tux
    image: ./skins/tux.png
    alt:
      en: "EARL's Synth page in the Tux skin: near-black panels, its waves, envelopes and switches in yellow, their points in green"
      es: "La página Synth de EARL con la skin Tux: paneles casi negros, sus ondas, envolventes e interruptores en amarillo y sus puntos en verde"
    caption:
      en: "Only on Linux: near black, with Tux's yellow and a terminal's green."
      es: "Solo en Linux: casi negra, con el amarillo de Tux y el verde de una terminal."
# On the home page, its window by day and by night in more of its skins than SynthWorld's two: the light one by day
nightAndDay:
  - { day: Riso, night: Starship }
