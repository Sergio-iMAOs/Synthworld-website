name: EARL
version: 1.0.0
formats: [CLAP, VST3, LV2, Standalone]
platforms: [Linux]
order: 1
# Its planet on the synths' page: its own (src/space.ts), made of chunks of its window in SW Light, ringed with its velvet noise
planet: earl
# The systems the framework builds for; none has a file yet
downloads:
  - { os: windows, arch: x64 }
  - { os: macos, arch: universal }
  - { os: linux, arch: x64 }
  - { os: linux, arch: arm64 }
audio: []
videos: []
# Its header: the framework's EarlLogo, the sun and the name standing on the horizon the page draws
logo: ./logo.png
# Taken from the framework by `npm run screenshots` (scripts/screenshots.mjs, which says how each one is taken).
# en.md and es.md place each screenshot with <!-- screenshot: <id> -->.
cover:
  image: ./screenshots/synth.png
  alt:
    en: "EARL's window on its Synth page: three oscillators, the noise and the sub-oscillator at the top, the filters and the voice's distortions under them, the envelopes and LFOs at the bottom"
    es: "La ventana de EARL en su página Synth: tres osciladores, el ruido y el suboscilador arriba, los filtros y las distorsiones de la voz debajo, y las envolventes y los LFO abajo"
# Its window with its third oscillator showing its unison: by day on the home page and in its node's pane on the synths'
# page, and by night
home:
  day:
    image: ./screenshots/home-day.png
    alt:
      en: "EARL's Synth page in the SW Light skin: a wavetable oscillator, a granular one playing a sample, and a third oscillator showing its unison, nine voices spread between left and right"
      es: "La página Synth de EARL con la skin SW Light: un oscilador de tablas de ondas, uno granular tocando una muestra, y un tercer oscilador mostrando su unísono, nueve voces repartidas entre izquierda y derecha"
  night:
    image: ./screenshots/home-night.png
    alt:
      en: "EARL's Synth page in the SW Default skin: a wavetable oscillator, a granular one playing a sample, and a third oscillator showing its unison, nine voices spread between left and right"
      es: "La página Synth de EARL con la skin SW Default: un oscilador de tablas de ondas, uno granular tocando una muestra, y un tercer oscilador mostrando su unísono, nueve voces repartidas entre izquierda y derecha"
screenshots:
  # A screenshot with a loop is shown moving: a knob turned and back, or buttons pressed in turn (scripts/screenshots.mjs)
  # Its generators, close up: the first oscillator as each of its four, and the noise with the sub-oscillator under it
  - id: wavetable
    image: ./screenshots/wavetable.png
    loop: /loops/earl/wavetable.mp4
    alt:
      en: "A wavetable oscillator playing the Wavefolder wavetable: its frames drawn one behind the other, the one it's at in front, over its COARSE, ST and CT fields and its PHASE, RANDOM, FM, POS, SYNC, PAN and GAIN knobs"
      es: "Un oscilador de tablas de ondas tocando la tabla Wavefolder: sus fotogramas dibujados uno detrás de otro, con el que está sonando delante, sobre sus campos COARSE, ST y CT y sus perillas PHASE, RANDOM, FM, POS, SYNC, PAN y GAIN"
    caption:
      en: "A wavetable oscillator, moving through its wavetable."
      es: "Un oscilador de tablas de ondas, que recorre su tabla."
  - id: triple-oscillator
    image: ./screenshots/triple-oscillator.png
    alt:
      en: "The Triple Oscillator: three simple oscillators one above the other, playing a sine, a saw and a square, each with its wave's buttons, its pitch, phase, pulse width, pan and gain"
      es: "El Triple Oscillator: tres osciladores simples uno encima de otro, tocando una senoidal, una diente de sierra y una cuadrada, cada uno con los botones de su onda, su afinación, fase, ancho de pulso, paneo y ganancia"
    caption:
      en: "Three simple oscillators together, each a wave of its own."
      es: "Tres osciladores simples juntos, cada uno con su propia onda."
  - id: sampler
    image: ./screenshots/sampler.png
    alt:
      en: "The Sampler: a stereo sample's waveform between its start and end marks, the buttons of how it plays beside it, and its pitch, root key, release, pan and gain under it"
      es: "El Sampler: la forma de onda de un sample estéreo entre sus marcas de inicio y fin, los botones de cómo se toca a su lado, y debajo su afinación, nota raíz, release, paneo y ganancia"
    caption:
      en: "A sampler, playing your audio files."
      es: "Un sampler, que toca tus archivos de audio."
  - id: granular
    image: ./screenshots/granular.png
    loop: /loops/earl/granular.mp4
    alt:
      en: "The Granular: a sample's waveform with the part its grains are taken from lit, where it's at marked, and how many grains are playing; its SOURCE, SCAN, TIME, GRAIN, PITCH and MIX tabs, and its position, spray, pan and gain"
      es: "El Granular: la forma de onda de un sample con la parte de la que toma sus granos iluminada, el punto en el que está marcado, y cuántos granos suenan; sus pestañas SOURCE, SCAN, TIME, GRAIN, PITCH y MIX, y su posición, dispersión, paneo y ganancia"
    caption:
      en: "A granular, made of grains of a sample."
      es: "Un granular, hecho de granos de un sample."
  - id: noise
    image: ./screenshots/noise.png
    loop: /loops/earl/noise.mp4
    alt:
      en: "The Colour Noise playing pink noise, its colours' buttons under its display, and the Sub Oscillator under it with its wave's buttons, its pitch, phase, pan and gain"
      es: "El Colour Noise tocando ruido rosa, con los botones de sus colores bajo su pantalla, y debajo el Sub Oscillator con los botones de su onda, su afinación, fase, paneo y ganancia"
    caption:
      en: "A coloured noise, here pink, and the sub-oscillator under it."
      es: "Un ruido de color, aquí rosa, y el suboscilador debajo."
  # What the voice's sound goes through, close up: its four filters, one of each kind, and its saturator and bitcrusher
  - id: filter-ladder
    image: ./screenshots/filter-ladder.png
    loop: /loops/earl/filter-ladder.mp4
    alt:
      en: "The Ladder Filter: its curve, low-pass at 24 dB, beside its CUTOFF, RES, DRIVE and MIX knobs, and the buttons of the sources going into it"
      es: "El Ladder Filter: su curva, paso bajo de 24 dB, junto a sus perillas CUTOFF, RES, DRIVE y MIX, y los botones de las fuentes que entran en él"
    caption:
      en: "A ladder filter, low-pass or high-pass, with a drive of its own."
      es: "Un filtro ladder, paso bajo o paso alto, con su propia saturación."
  - id: filter-state-variable
    image: ./screenshots/filter-state-variable.png
    loop: /loops/earl/filter-state-variable.mp4
    alt:
      en: "The State Variable Filter: its curve beside its CUTOFF, Q, TYPE, DRIVE and MIX knobs and its slope, 12 dB"
      es: "El State Variable Filter: su curva junto a sus perillas CUTOFF, Q, TYPE, DRIVE y MIX y su pendiente, 12 dB"
    caption:
      en: "A state variable filter, morphing from low-pass to band-pass to high-pass."
      es: "Un filtro de variable de estado, que pasa de paso bajo a paso banda y a paso alto."
  - id: filter-comb
    image: ./screenshots/filter-comb.png
    loop: /loops/earl/filter-comb.mp4
    alt:
      en: "The Comb Filter: its comb of peaks across the frequencies beside its FREQ, FEEDBACK, DAMP and MIX knobs, its key tracking on"
      es: "El Comb Filter: su peine de picos a lo largo de las frecuencias junto a sus perillas FREQ, FEEDBACK, DAMP y MIX, con su seguimiento de teclado activado"
    caption:
      en: "A comb filter, ringing like a string or a tube at the note you play."
      es: "Un filtro comb, que resuena como una cuerda o un tubo en la nota que tocas."
  - id: filter-formant
    image: ./screenshots/filter-formant.png
    loop: /loops/earl/filter-formant.mp4
    alt:
      en: "The Formant Filter: a vowel's peaks beside its voice, TENOR, and its VOWEL, SHIFT, Q and MIX knobs"
      es: "El Formant Filter: los picos de una vocal junto a su voz, TENOR, y sus perillas VOWEL, SHIFT, Q y MIX"
    caption:
      en: "A formant filter, making the sound talk in a bass's, tenor's, alto's or soprano's vowels."
      es: "Un filtro de formantes, que hace hablar al sonido con las vocales de un bajo, un tenor, una contralto o una soprano."
  - id: saturator
    image: ./screenshots/saturator.png
    loop: /loops/earl/saturator.mp4
    alt:
      en: "The Voice Saturator in TUBE: its curve beside its high-pass and low-pass filters, and its DRIVE, OUTPUT and MIX knobs"
      es: "El Voice Saturator en TUBE: su curva junto a sus filtros paso alto y paso bajo, y sus perillas DRIVE, OUTPUT y MIX"
    caption:
      en: "The voice's saturator, here a tube's warmth: one of six curves."
      es: "El saturador de la voz, aquí con la calidez de un tubo: una de seis curvas."
  - id: bitcrusher
    image: ./screenshots/bitcrusher.png
    loop: /loops/earl/bitcrusher.mp4
    alt:
      en: "The Voice Bitcrusher at 3000 Hz: a wave cut into steps beside its BITS, RATE, DITHER and MIX knobs"
      es: "El Voice Bitcrusher a 3000 Hz: una onda cortada en escalones junto a sus perillas BITS, RATE, DITHER y MIX"
    caption:
      en: "The voice's bitcrusher, fewer bits and a lower rate for a grainier sound."
      es: "El bitcrusher de la voz: menos bits y menos frecuencia de muestreo para un sonido más granulado."
  - id: velvet-noise
    image: ./screenshots/velvet-noise.png
    loop: /loops/earl/velvet-noise.mp4
    alt:
      en: "The velvet noise's panel: its pulses drawn as dots over its DENSITY, JITTER, PW, PAN and GAIN knobs and its LEVEL and MONO switches"
      es: "El panel del ruido velvet: sus pulsos dibujados como puntos sobre sus perillas DENSITY, JITTER, PW, PAN y GAIN y sus interruptores LEVEL y MONO"
    caption:
      en: "Its display draws the pulses as the noise plays them."
      es: "Su pantalla dibuja los pulsos tal como el ruido los toca."
  - id: graph
    image: ./screenshots/graph.png
    alt:
      en: "EARL's Graph page with every processor on: the notes' nodes on the left; the voice's oscillators, noise and sub-oscillator cabled into four filters, then the saturator and the VCA, its LFOs, envelopes and what you play under them; and the effects in a chain on the right"
      es: "La página Graph de EARL con todos los procesadores encendidos: los nodos de las notas a la izquierda; los osciladores, el ruido y el suboscilador de la voz cableados a cuatro filtros, luego el saturador y el VCA, y debajo sus LFO, envolventes y lo que tocas; y los efectos en cadena a la derecha"
    caption:
      en: "The Graph page: each voice on the left, the effects on the right."
      es: "La página Graph: cada voz a la izquierda, los efectos a la derecha."
  - id: mod-matrix
    image: ./screenshots/mod-matrix.png
    alt:
      en: "The voice's modulation matrix: a row for each modulation, the Amp Envelope on the VCA's gain, LFOs on a wavetable's position, pan and pitch, the mod wheel on another modulation's amount, each with its amount and its curve"
      es: "La matriz de modulación de la voz: una fila por modulación, la Amp Envelope sobre la ganancia del VCA, LFO sobre la posición, el paneo y la afinación de una tabla de ondas, la rueda de modulación sobre la cantidad de otra modulación, cada una con su cantidad y su curva"
    caption:
      en: "The Mod Matrix page: each modulation with its amount and its curve, even of another one."
      es: "La página Mod Matrix: cada modulación con su cantidad y su curva, incluso de otra."
  - id: global
    image: ./screenshots/global.png
    alt:
      en: "EARL's FX page: eight effects in two columns, a filter, a saturator, a bitcrusher, a chorus, a flanger, a phaser, a delay and a reverb, each with its display; the global envelope, LFO and audio input under them"
      es: "La página FX de EARL: ocho efectos en dos columnas, un filtro, un saturador, un bitcrusher, un chorus, un flanger, un phaser, un delay y una reverb, cada uno con su pantalla; y debajo la envolvente, el LFO y la entrada de audio globales"
    caption:
      en: "The FX page: the eight effect slots, and the effects' own modulators."
      es: "La página FX: las ocho ranuras de efectos y los moduladores propios de los efectos."
  - id: randomiser
    image: ./screenshots/randomiser.png
    alt:
      en: "The randomiser's panel: a DEVIATION slider, switches for values, choices, mod amounts, processors, connections and new modulations, and the RESET and RANDOMISE buttons"
      es: "El panel del aleatorizador: un deslizador DEVIATION, interruptores para valores, opciones, cantidades de modulación, procesadores, conexiones y modulaciones nuevas, y los botones RESET y RANDOMISE"
    caption:
      en: "The randomiser, opened from the die in the header."
      es: "El aleatorizador, que se abre desde el dado de la cabecera."
  - id: notes
    image: ./screenshots/notes.png
    alt:
      en: "EARL's Notes page: the transposition, the chord maker and the arpeggiator, all three on, at the top; the voices' settings under them, and the unison's, five voices drawn between left and right"
      es: "La página Notes de EARL: la transposición, el generador de acordes y el arpegiador, los tres encendidos, arriba; debajo los ajustes de las voces, y los del unísono, cinco voces dibujadas entre izquierda y derecha"
    caption:
      en: "The Notes page: what changes the notes, and the voices, glide and unison."
      es: "La página Notes: lo que cambia las notas, y las voces, el glide y el unísono."
  - id: oscillator-unison
    image: ./screenshots/oscillator-unison.png
    loop: /loops/earl/oscillator-unison.mp4
    alt:
      en: "A wavetable oscillator showing its unison: its voices drawn as lines between left and right, over its VOICES, DETUNE, WIDTH, BLEND, WT SPREAD and BIAS knobs"
      es: "Un oscilador de tablas de ondas mostrando su unísono: sus voces dibujadas como líneas entre izquierda y derecha, sobre sus perillas VOICES, DETUNE, WIDTH, BLEND, WT SPREAD y BIAS"
    caption:
      en: "An oscillator's unison."
      es: "El unísono de un oscilador."
  - id: voice-unison
    image: ./screenshots/voice-unison.png
    loop: /loops/earl/voice-unison.mp4
    alt:
      en: "The voice's unison on the Notes page: its voices drawn as lines between left and right, over the UNISON menu and its DETUNE, WIDTH, BLEND and BIAS sliders"
      es: "El unísono de la voz en la página Notes: sus voces dibujadas como líneas entre izquierda y derecha, sobre el menú UNISON y sus deslizadores DETUNE, WIDTH, BLEND y BIAS"
    caption:
      en: "The voice's unison, on the Notes page."
      es: "El unísono de la voz, en la página Notes."
  - id: tuning
    image: ./screenshots/tuning.png
    alt:
      en: "EARL's Tuning page playing Bohlen-Pierce: EARL's tunings to choose from on the left, Bohlen-Pierce's description and its 13 notes drawn across its period of 1902 cents in the middle, and its settings on the right: A's pitch, its reference and root keys, where it repeats, and each of its notes in cents"
      es: "La página Tuning de EARL tocando Bohlen-Pierce: las afinaciones de EARL entre las que elegir a la izquierda, la descripción de Bohlen-Pierce y sus 13 notas dibujadas a lo largo de su periodo de 1902 cents en el centro, y sus ajustes a la derecha: la altura del La, sus notas de referencia y raíz, dónde se repite y cada una de sus notas en cents"
    caption:
      en: "The Tuning page, in Bohlen-Pierce: 13 notes to a tritave."
      es: "La página Tuning, en Bohlen-Pierce: 13 notas por tritava."
# Its skins, in the order it offers them (Tux is only on Linux): the Synth page in each, taken the same way
skins:
  - name: SW Default
    image: ./skins/sw-default.png
    alt:
      en: "EARL's Synth page in the SW Default skin: dark grey panels, its waves, envelopes and switches in violet, their points in yellow"
      es: "La página Synth de EARL con la skin SW Default: paneles gris oscuro, sus ondas, envolventes e interruptores en violeta y sus puntos en amarillo"
    caption:
      en: "SynthWorld's own: dark, in violet and yellow."
      es: "La de SynthWorld: oscura, en violeta y amarillo."
  - name: SW Light
    image: ./skins/sw-light.png
    alt:
      en: "EARL's Synth page in the SW Light skin: pale grey panels, dark text and knobs, its waves and switches in violet, their points in orange"
      es: "La página Synth de EARL con la skin SW Light: paneles gris claro, textos y perillas oscuros, sus ondas e interruptores en violeta y sus puntos en naranja"
    caption:
      en: "SynthWorld's own, light: pale panels and dark text."
      es: "La de SynthWorld, clara: paneles pálidos y texto oscuro."
  - name: Deep Sea
    image: ./skins/deep-sea.png
    alt:
      en: "EARL's Synth page in the Deep Sea skin: navy blue panels, its waves, envelopes and switches in bright blue, their points in amber"
      es: "La página Synth de EARL con la skin Deep Sea: paneles azul marino, sus ondas, envolventes e interruptores en azul vivo y sus puntos en ámbar"
    caption:
      en: "EARL's own: navy blues, a bright blue and amber."
      es: "La de EARL: azules marinos, un azul vivo y ámbar."
  - name: Riso
    image: ./skins/riso.png
    alt:
      en: "EARL's Synth page in the Riso skin: cards of speckled cream paper outlined in black ink, mustard knobs ringed with inked rays, displays of straw paper with their waves shaded in vermilion, and the panel that's off hatched over"
      es: "La página Synth de EARL con la skin Riso: tarjetas de papel crema moteado perfiladas en tinta negra, perillas mostaza rodeadas de rayos entintados, pantallas de papel de paja con sus ondas sombreadas en bermellón, y el panel apagado tachado con un rayado"
    caption:
      en: "EARL's own, a riso poster: paper, inks and shapes of its own."
      es: "La de EARL, un póster de risografía: papel, tintas y formas propias."
  - name: Starship
    image: ./skins/starship.png
    alt:
      en: "EARL's Synth page in the Starship skin: screens of dark glass with cut corners outlined in cyan light, dials lit up to their values, its waves and switches in cyan, their points in amber"
      es: "La página Synth de EARL con la skin Starship: pantallas de cristal oscuro con las esquinas cortadas y perfiladas en luz cian, diales iluminados hasta su valor, sus ondas e interruptores en cian y sus puntos en ámbar"
    caption:
      en: "EARL's own, a starship's cockpit: screens of glass lit in cyan."
      es: "La de EARL, la cabina de una nave: pantallas de cristal iluminadas en cian."
  - name: Tux
    image: ./skins/tux.png
    alt:
      en: "EARL's Synth page in the Tux skin: near-black panels, its waves, envelopes and switches in yellow, their points in green"
      es: "La página Synth de EARL con la skin Tux: paneles casi negros, sus ondas, envolventes e interruptores en amarillo y sus puntos en verde"
    caption:
      en: "Only on Linux: near black, with Tux's yellow and a terminal's green."
      es: "Solo en Linux: casi negra, con el amarillo de Tux y el verde de una terminal."
# On its page, its window by day and by night in more of its skins than SynthWorld's two, the lighter one by day
nightAndDay:
  - { day: Riso, night: Starship }
  - { day: Deep Sea, night: Tux }
